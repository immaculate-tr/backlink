name: Weekly Backlink Verification

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sources
        run: node scripts/generate-sources.cjs

      - name: Run backlink verification
        run: node scripts/verify-backlinks.cjs

      - name: Commit results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/results.json
          git commit -m "chore: weekly backlink verification $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
