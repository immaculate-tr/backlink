name: Retry Engine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run retry engine
        env:
          DRY_RUN: ${{ secrets.DRY_RUN || 'true' }}
        run: python -m scripts.retry

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/queue.json data/failed.json data/logs.json
          git diff --staged --quiet || git commit -m "Retry: failed jobs processed"
          git push
