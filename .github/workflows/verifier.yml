name: Verifier

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run verifier
        run: python -m scripts.verifier

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backlinks.json data/logs.json
          git diff --staged --quiet || git commit -m "Verifier: backlinks checked"
          git push
